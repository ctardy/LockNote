name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the release job writes (the release itself).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # MSVC toolchain: the Windows resources are compiled by rc.exe.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: cmd
        run: scripts\build.cmd

      # Swap helper staged again, LOCALAPPDATA / TEMP / TMP redirected to a
      # throwaway folder (see the script).
      - name: Run tests
        shell: cmd
        run: scripts\test.cmd

      - name: Sign executables
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: build
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Never package an unsigned or badly signed exe.
      - name: Check the Authenticode signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build\LockNote.exe
          Write-Host "Authenticode status: $($sig.Status) signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "build\LockNote.exe is not validly signed (status: $($sig.Status))"
            exit 1
          }

      - name: Package
        shell: bash
        run: |
          mkdir staging
          cp build/LockNote.exe staging/
          cp README.md staging/
          cp LICENSE staging/
          cd staging
          sha256sum LockNote.exe > SHA256SUMS.txt
          7z a ../LockNote-windows-x64.zip .
          # The updater downloads the zip and looks up its SHA256 in the
          # standalone SHA256SUMS.txt asset. Append the zip's own hash to
          # a copy published next to the zip. The copy inside the zip
          # intentionally omits the zip hash (self-reference impossible).
          cp SHA256SUMS.txt ../SHA256SUMS.txt
          (cd .. && sha256sum LockNote-windows-x64.zip) >> ../SHA256SUMS.txt

      # Ed25519 signature over the raw SHA256SUMS.txt bytes. The client
      # refuses to trust the hash file without a matching .sig when
      # RELEASE_PUBLIC_KEY is set in src/updater.rs. See
      # docs/release-signing-setup.md for how the keypair is generated and
      # how the private key is installed as a GitHub Actions secret.
      - name: Install signing deps
        shell: bash
        run: pip install --disable-pip-version-check 'cryptography>=42,<46'

      - name: Sign SHA256SUMS.txt
        shell: bash
        env:
          RELEASE_SIGNING_KEY_HEX: ${{ secrets.RELEASE_SIGNING_KEY_HEX }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY_HEX" ]; then
            echo "::error::RELEASE_SIGNING_KEY_HEX secret is not set — configure it per docs/release-signing-setup.md"
            exit 1
          fi
          python scripts/sign-sha256sums.py SHA256SUMS.txt
          # Paranoia: verify what we just produced using the public key
          # derived from the same seed, so a silently-corrupt signature
          # cannot ship to users.
          python - <<'PY'
          import os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          seed = bytes.fromhex(os.environ['RELEASE_SIGNING_KEY_HEX'])
          pk = Ed25519PrivateKey.from_private_bytes(seed).public_key()
          with open('SHA256SUMS.txt', 'rb') as f: payload = f.read()
          with open('SHA256SUMS.txt.sig', 'rb') as f: sig = f.read()
          pk.verify(sig, payload)
          print('signature self-check: OK')
          # The seed must match RELEASE_PUBLIC_KEY in src/updater.rs, or
          # every installed client refuses the release.
          import re
          from cryptography.hazmat.primitives import serialization as ser
          src = open('src/updater.rs', encoding='utf-8').read()
          block = re.search(r'RELEASE_PUBLIC_KEY: Option<\[u8; 32\]> = Some\(\[(.*?)\]\)', src, re.S)
          if block is None:
              raise SystemExit('RELEASE_PUBLIC_KEY not found in src/updater.rs')
          embedded = bytes(int(h, 16) for h in re.findall(r'0x([0-9a-fA-F]{2})', block.group(1)))
          derived = pk.public_bytes(ser.Encoding.Raw, ser.PublicFormat.Raw)
          if embedded != derived:
              raise SystemExit('RELEASE_SIGNING_KEY_HEX does not match RELEASE_PUBLIC_KEY in src/updater.rs')
          print('embedded public key: OK')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LockNote-windows-x64
          path: |
            LockNote-windows-x64.zip
            SHA256SUMS.txt
            SHA256SUMS.txt.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # By name, into the folder the files below are read from (a single
      # artifact is extracted directly into `path` since v5 / v8).
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: LockNote-windows-x64
          path: artifacts/LockNote-windows-x64

      # Published in this repository, the one the updater reads
      # (`GITHUB_REPO` in src/updater.rs). No mirror any more (issue 059).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # A missing asset fails the release instead of publishing it empty.
          fail_on_unmatched_files: true
          files: |
            artifacts/LockNote-windows-x64/LockNote-windows-x64.zip
            artifacts/LockNote-windows-x64/SHA256SUMS.txt
            artifacts/LockNote-windows-x64/SHA256SUMS.txt.sig
