<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#c8d6e5"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M256 28 L462 100 C462 100 472 280 380 390 C320 460 256 488 256 488
           C256 488 192 460 132 390 C40 280 50 100 50 100 Z"
        fill="url(#shieldGrad)" stroke="#162d50" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner highlight border -->
  <path d="M256 56 L436 118 C436 118 445 272 362 372 C308 434 256 460 256 460
           C256 460 204 434 150 372 C67 272 76 118 76 118 Z"
        fill="none" stroke="#5b9cf6" stroke-width="2" stroke-linejoin="round" opacity="0.4"/>

  <!-- Lock body -->
  <rect x="196" y="248" width="120" height="100" rx="12" ry="12"
        fill="url(#lockGrad)" stroke="#162d50" stroke-width="5"/>

  <!-- Lock shackle -->
  <path d="M216 248 L216 200 C216 168 232 148 256 148 C280 148 296 168 296 200 L296 248"
        fill="none" stroke="url(#lockGrad)" stroke-width="18" stroke-linecap="round"/>
  <path d="M216 248 L216 200 C216 168 232 148 256 148 C280 148 296 168 296 200 L296 248"
        fill="none" stroke="#162d50" stroke-width="5" stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="256" cy="290" r="14" fill="#162d50"/>
  <rect x="251" y="296" width="10" height="24" rx="3" fill="#162d50"/>
</svg>
